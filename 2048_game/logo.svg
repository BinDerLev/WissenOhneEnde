<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#ff6b9d" rx="15"/>

  <!-- Grid background -->
  <rect x="15" y="15" width="70" height="70" fill="rgba(50, 30, 80, 0.3)" rx="5"/>

  <!-- Tiles with numbers -->
  <g>
    <!-- 2 -->
    <rect x="18" y="18" width="15" height="15" fill="#ff6b9d" rx="2"/>
    <text x="25.5" y="28" font-size="12" font-weight="bold" fill="white" text-anchor="middle">2</text>

    <!-- 4 -->
    <rect x="36" y="18" width="15" height="15" fill="#ff5a8f" rx="2"/>
    <text x="43.5" y="28" font-size="12" font-weight="bold" fill="white" text-anchor="middle">4</text>

    <!-- 8 -->
    <rect x="54" y="18" width="15" height="15" fill="#e85b8a" rx="2"/>
    <text x="61.5" y="28" font-size="12" font-weight="bold" fill="white" text-anchor="middle">8</text>

    <!-- 16 -->
    <rect x="18" y="36" width="15" height="15" fill="#ff8800" rx="2"/>
    <text x="25.5" y="46" font-size="11" font-weight="bold" fill="white" text-anchor="middle">16</text>

    <!-- 32 -->
    <rect x="36" y="36" width="15" height="15" fill="#ffdd00" rx="2"/>
    <text x="43.5" y="46" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">32</text>

    <!-- 2048 -->
    <rect x="27" y="54" width="30" height="18" fill="#9933ff" rx="3"/>
    <text x="42" y="66" font-size="14" font-weight="bold" fill="white" text-anchor="middle">2048</text>
  </g>
</svg>
