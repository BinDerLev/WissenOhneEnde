<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img"
     aria-label="Gruseliges Logo: Gefangen Unter Wasser">
    <defs>
        <linearGradient id="darkSea" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00121a"/>
            <stop offset="60%" stop-color="#001f2b"/>
            <stop offset="100%" stop-color="#000000"/>
        </linearGradient>
        <radialGradient id="redGlow" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#ff2d2d" stop-opacity="0.95"/>
            <stop offset="60%" stop-color="#7a0000" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- dunkler Hintergrundkreis / Blase -->
    <circle cx="256" cy="200" r="150" fill="url(#darkSea)" filter="url(#softShadow)"/>

    <!-- unruhige, gezackte Welle / Riss als weiß/dunkel-hell Kontrast -->
    <path d="M120 300 C165 230, 210 220, 260 260 C305 295, 350 290, 400 255" fill="none" stroke="#071923"
          stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120 320 C170 240, 210 235, 260 275 C305 312, 360 310, 410 270" fill="none" stroke="#0f3740"
          stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- zentrale unheimliche Blase / Auge -->
    <g transform="translate(256,200)">
        <!-- äußere ringförmige Blase, leicht transparent -->
        <circle r="72" fill="rgba(255,255,255,0.03)" stroke="#082a2e" stroke-width="6"/>
        <!-- dunkles Auge / Pupil -->
        <ellipse rx="34" ry="22" fill="#000"/>
        <!-- roter Schein in der oberen rechten Seite -->
        <ellipse cx="18" cy="-10" rx="28" ry="16" fill="url(#redGlow)" opacity="0.28"/>
        <!-- kleines, blutrotes Highlight (unheimlich) -->
        <circle cx="-10" cy="10" r="4" fill="#ff2d2d"/>
    </g>

    <!-- tropfende Blutakzente unterhalb -->
    <g fill="#7b0000" opacity="0.95">
        <path d="M220 330 C222 346, 234 352, 238 332 C242 312, 230 316, 220 330 Z"/>
        <path d="M280 350 C282 370, 300 374, 298 352 C296 330, 280 336, 280 350 Z"/>
        <path d="M340 330 C342 346, 356 350, 350 332 C344 314, 338 320, 340 330 Z"/>
    </g>

    <!-- feine Risse/Spalten (dunkel, um Alter/Verfall zu zeigen) -->
    <path d="M170 210 L190 200 L210 212 L230 198" fill="none" stroke="#041518" stroke-width="3" stroke-linecap="round"
          opacity="0.9"/>
    <path d="M315 245 L335 232 L355 244" fill="none" stroke="#041518" stroke-width="3" stroke-linecap="round"
          opacity="0.9"/>

    <!-- optionaler Titel in unheimlicher Typografie -->

    <!-- dezente Körnung / Filmkorn für Atmosphäre -->
    <g opacity="0.06" fill="#000000">
        <circle cx="40" cy="40" r="1"/>
        <circle cx="120" cy="80" r="1"/>
        <circle cx="200" cy="30" r="1"/>
        <circle cx="300" cy="100" r="1"/>
        <circle cx="420" cy="60" r="1"/>
        <circle cx="480" cy="160" r="1"/>
    </g>

</svg>

