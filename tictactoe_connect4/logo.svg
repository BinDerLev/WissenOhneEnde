<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#16213e" rx="15"/>

  <!-- Tic-Tac-Toe Grid (left side) -->
  <g>
    <!-- Grid lines -->
    <line x1="18" y1="28" x2="32" y2="28" stroke="#00aaff" stroke-width="1"/>
    <line x1="18" y1="38" x2="32" y2="38" stroke="#00aaff" stroke-width="1"/>
    <line x1="22" y1="24" x2="22" y2="42" stroke="#00aaff" stroke-width="1"/>
    <line x1="28" y1="24" x2="28" y2="42" stroke="#00aaff" stroke-width="1"/>

    <!-- X marks -->
    <line x1="19" y1="25" x2="21" y2="27" stroke="#ff6b9d" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="21" y1="25" x2="19" y2="27" stroke="#ff6b9d" stroke-width="1.5" stroke-linecap="round"/>

    <!-- O mark -->
    <circle cx="25" cy="33" r="1.5" fill="none" stroke="#ffdd44" stroke-width="1.5"/>
  </g>

  <!-- Vier Gewinnt Grid (right side) -->
  <g>
    <!-- Circles -->
    <circle cx="42" cy="26" r="3" fill="none" stroke="#00aaff" stroke-width="1"/>
    <circle cx="50" cy="26" r="3" fill="none" stroke="#00aaff" stroke-width="1"/>
    <circle cx="58" cy="26" r="3" fill="none" stroke="#00aaff" stroke-width="1"/>
    <circle cx="66" cy="26" r="3" fill="none" stroke="#00aaff" stroke-width="1"/>

    <circle cx="42" cy="34" r="3" fill="none" stroke="#00aaff" stroke-width="1"/>
    <circle cx="50" cy="34" r="3" fill="none" stroke="#00aaff" stroke-width="1"/>
    <circle cx="58" cy="34" r="3" fill="none" stroke="#00aaff" stroke-width="1"/>
    <circle cx="66" cy="34" r="3" fill="none" stroke="#00aaff" stroke-width="1"/>

    <!-- Red and yellow pieces -->
    <circle cx="50" cy="26" r="2.5" fill="#ff6b9d"/>
    <circle cx="58" cy="26" r="2.5" fill="#ffdd44"/>
    <circle cx="42" cy="34" r="2.5" fill="#ff6b9d"/>
    <circle cx="58" cy="34" r="2.5" fill="#ffdd44"/>
  </g>

  <!-- Divider -->
  <line x1="34" y1="20" x2="34" y2="45" stroke="#00aaff" stroke-width="1" opacity="0.3"/>

  <!-- Text labels -->
  <text x="25" y="52" font-size="9" fill="#00aaff" text-anchor="middle" font-weight="bold">TIC-TAC</text>
  <text x="25" y="62" font-size="8" fill="#00aaff" text-anchor="middle">TOE</text>

  <text x="56" y="52" font-size="9" fill="#00aaff" text-anchor="middle" font-weight="bold">4 IN A</text>
  <text x="56" y="62" font-size="8" fill="#00aaff" text-anchor="middle">ROW</text>
</svg>
