<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#1a2a4a" rx="15"/>

  <!-- Stars -->
  <circle cx="20" cy="20" r="1.5" fill="#ffdd44"/>
  <circle cx="80" cy="25" r="1" fill="#ffdd44"/>
  <circle cx="15" cy="80" r="1.2" fill="#ffdd44"/>
  <circle cx="85" cy="75" r="1" fill="#ffdd44"/>

  <!-- Spaceship -->
  <g transform="translate(50, 35)">
    <!-- Main body -->
    <polygon points="0,-12 -8,8 -2,5 2,5 8,8" fill="#00ffaa" stroke="#00ff99" stroke-width="1"/>
    <!-- Thruster flame -->
    <polygon points="-3,8 3,8 0,16" fill="#ffaa00" opacity="0.8"/>
  </g>

  <!-- Asteroids -->
  <g>
    <!-- Large asteroid -->
    <circle cx="25" cy="65" r="12" fill="none" stroke="#ffbb00" stroke-width="2"/>
    <circle cx="20" cy="62" r="3" fill="#ffbb00"/>
    <circle cx="30" cy="68" r="2" fill="#ffbb00"/>

    <!-- Medium asteroid -->
    <circle cx="75" cy="60" r="8" fill="none" stroke="#ffbb00" stroke-width="1.5"/>
    <circle cx="78" cy="63" r="2" fill="#ffbb00"/>
  </g>

  <!-- Laser beam -->
  <line x1="50" y1="23" x2="50" y2="50" stroke="#ffdd44" stroke-width="2" opacity="0.6"/>
</svg>
