<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout - Brick Breaker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
</head>
<body>
    <div class="container">
        <h1>🧱 Breakout</h1>
        <div class="game-info">
            <div class="score-box">
                <span>Score:</span>
                <div id="score">0</div>
            </div>
            <div class="level-box">
                <span>Level:</span>
                <div id="level">1</div>
            </div>
            <div class="lives-box">
                <span>Lives:</span>
                <div id="lives">3</div>
            </div>
            <div class="coin-box">
                <span>Münzen:</span>
                <div id="coins">0</div>
            </div>
            <div class="best-box">
                <span>Best:</span>
                <div id="bestScore">0</div>
            </div>
        </div>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="controls">
            <button id="startBtn" class="btn btn-start">Start Game</button>
            <button id="pauseBtn" class="btn btn-pause" disabled>Pause</button>
            <button id="resetBtn" class="btn btn-reset">Neustart</button>
        </div>
        <div class="upgrade-panel">
            <button type="button" class="upgrade-btn" data-upgrade="paddle">🛠️ Paddle + 25</button>
            <button type="button" class="upgrade-btn" data-upgrade="ball">🎯 Ball + 30</button>
            <button type="button" class="upgrade-btn" data-upgrade="life">💚 Life + 35</button>
        </div>
        <div class="instructions">
            <h3>Anleitung:</h3>
            <p>🎮 Verwende die <strong>Pfeiltasten (← →)</strong> oder <strong>A/D</strong> um das Paddel zu bewegen</p>
            <p>🎯 Zerstöre alle Blöcke um zum nächsten Level zu gelangen</p>
            <p>❤️ Du hast 3 Leben - lass den Ball nicht fallen!</p>
            <p>⭐ Farbige Blöcke geben unterschiedliche Punkte</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
