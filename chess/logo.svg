<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#302b63" rx="15"/>

  <!-- Chessboard -->
  <g>
    <!-- White squares -->
    <rect x="15" y="20" width="8" height="8" fill="#f0f0f0"/>
    <rect x="31" y="20" width="8" height="8" fill="#f0f0f0"/>
    <rect x="47" y="20" width="8" height="8" fill="#f0f0f0"/>
    <rect x="63" y="20" width="8" height="8" fill="#f0f0f0"/>

    <rect x="23" y="28" width="8" height="8" fill="#f0f0f0"/>
    <rect x="39" y="28" width="8" height="8" fill="#f0f0f0"/>
    <rect x="55" y="28" width="8" height="8" fill="#f0f0f0"/>
    <rect x="71" y="28" width="8" height="8" fill="#f0f0f0"/>

    <!-- Dark squares -->
    <rect x="23" y="20" width="8" height="8" fill="#333"/>
    <rect x="39" y="20" width="8" height="8" fill="#333"/>
    <rect x="55" y="20" width="8" height="8" fill="#333"/>
    <rect x="71" y="20" width="8" height="8" fill="#333"/>

    <rect x="15" y="28" width="8" height="8" fill="#333"/>
    <rect x="31" y="28" width="8" height="8" fill="#333"/>
    <rect x="47" y="28" width="8" height="8" fill="#333"/>
    <rect x="63" y="28" width="8" height="8" fill="#333"/>
  </g>

  <!-- Black King (left) -->
  <g transform="translate(25, 55)">
    <polygon points="0,-8 -5,0 -3,3 3,3 5,0" fill="#333"/>
    <rect x="-2" y="3" width="4" height="5" fill="#333"/>
    <circle cx="0" cy="2" r="1.5" fill="#ffdd44"/>
  </g>

  <!-- White Queen (right) -->
  <g transform="translate(75, 55)">
    <polygon points="0,-8 -5,0 -3,3 3,3 5,0" fill="#f0f0f0"/>
    <rect x="-2" y="3" width="4" height="5" fill="#f0f0f0"/>
    <circle cx="0" cy="2" r="1.5" fill="#333"/>
    <!-- Crown dots -->
    <circle cx="-2" cy="-6" r="0.8" fill="#333"/>
    <circle cx="2" cy="-6" r="0.8" fill="#333"/>
  </g>

  <!-- Decorative pieces at bottom -->
  <circle cx="30" cy="80" r="3" fill="#333"/>
  <circle cx="50" cy="80" r="3" fill="#f0f0f0"/>
  <circle cx="70" cy="80" r="3" fill="#333"/>
</svg>
